name: Auto Release

on:
  workflow_dispatch:
    inputs:
      release_authorized:
        description: Explicitly authorize creating a version tag/release and triggering npm publication
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.release_authorized
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for version bump
        id: check
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PREVIOUS_VERSION=$(node scripts/previous-package-version.mjs)
          TAG="v${CURRENT_VERSION}"

          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "No prior package version is available; skipping auto release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "package.json version did not change (${CURRENT_VERSION}); skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git tag -l "$TAG" | grep -qx "$TAG"; then
            echo "Tag $TAG already exists; skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version bump detected: ${PREVIOUS_VERSION} -> ${CURRENT_VERSION}."
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.check.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          NOTES="Released ${TAG}."
          if [ -n "$PREV_TAG" ]; then
            NOTES="${NOTES}\n\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger publish workflow
        if: steps.check.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          gh workflow run publish.yml --ref "$TAG" -f ref="$TAG" -f publish_authorized=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
